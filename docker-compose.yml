services:
  mysql:
    image: mysql:8.0
    container_name: studyspace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: studyspace
      MYSQL_USER: studyspace
      MYSQL_PASSWORD: studyspace123
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: